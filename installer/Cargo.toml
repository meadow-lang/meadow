[workspace]

[package]
name = "meadowup"
version = "0.4.0"
edition = "2024"
description = "Installs and updates the Meadow language toolchain"

# The shared installer: where things go, how a release is fetched, and how the
# `bin` directory joins the PATH. Neither binary here depends on a Meadow crate
# -- this has to work before Meadow is installed at all.
[lib]
name = "meadowup"
path = "src/lib.rs"

# The toolchain manager, as `rustup` is to `cargo` -- and the thing people
# download: run from anywhere it installs itself and then the toolchain, so
# there is no separate bootstrap program, exactly as `rustup-init` *is* rustup.
[[bin]]
name = "meadowup"
path = "src/bin/meadowup.rs"


[target.'cfg(windows)'.dependencies]
winreg = "0.55"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
