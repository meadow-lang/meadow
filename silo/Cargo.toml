[workspace]

[package]
name = "meadow-silo"
description = "The runtime of a Meadow program compiled by meadow-llvm: blocks counted by reference as in the AxCut paper, primitives, and the native stack. For production, where a program is run for speed rather than stepped through."
version = "0.4.0"
edition = "2024"

[lib]
name = "meadow_silo"
path = "src/lib.rs"
# The static library is what a program links against; the rlib is for tests.
crate-type = ["rlib", "staticlib"]

[dependencies]
# Descriptors, number formatting and the numeric tower's rules, which this
# runtime must agree with the others about.
meadow-rt = { path = "../compiler/meadow-rt" }
num-bigint = "0.4"
# Stackful coroutines: the stack segments effect handlers run on (see
# `src/segments.rs`). Guard pages, and on Windows the thread information block
# kept in step so stack probes work -- the fiddly part, done.
corosensei = "0.3"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"
