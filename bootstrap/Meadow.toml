[package]
name = "MeadowBoot"
version = "0.1.0"

[dependencies]
Lingua = { git = "https://github.com/meadow-lang/Lingua.git", rev = "07cbed85b864c24441dd1fd45f6afdc49a24f440" }
Cut = { git = "https://github.com/meadow-lang/Cut.git", rev = "9f2b6fd6685306cfc488137e7f03e8521505eb07" }
Scythe = { git = "https://github.com/meadow-lang/Scythe.git", branch = "master" }

# Bytecode, on the JIT: a build with no LLVM in it, which is a third of the
# time one through Silo takes.
[profile.debug]
runtime = "glade"

# Native, through LLVM: the fastest MeadowBoot there is, and one that links
# with what LLVM links with.
[profile.release]
runtime = "silo"
