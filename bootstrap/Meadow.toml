[package]
name = "MeadowBoot"
version = "0.1.0"

[dependencies]
Lingua = { git = "https://github.com/meadow-lang/Lingua.git", rev = "92955a573a7ecd6b39c10080b41f8ff6ea272317" }
Cut = { git = "https://github.com/meadow-lang/Cut.git", rev = "18a5602312633e009825783001050fbafdf0e11a" }
Scythe = { git = "https://github.com/meadow-lang/Scythe.git", branch = "master" }

# Bytecode, on the JIT: a build with no LLVM in it, which is a third of the
# time one through Silo takes.
[profile.debug]
runtime = "glade"

# Native, through LLVM: the fastest MeadowBoot there is, and one that links
# with what LLVM links with.
[profile.release]
runtime = "silo"
