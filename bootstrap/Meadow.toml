[package]
name = "MeadowBoot"
version = "0.1.0"

[dependencies]
Lingua = { git = "https://github.com/meadow-lang/Lingua.git", rev = "d40e7af39121cb089ed7997e09d17de1328550a3" }
Cut = { git = "https://github.com/meadow-lang/Cut.git", rev = "b7a2ba473e2a0c5e7e2a59b5bdba62d969f4e61c" }
Scythe = { git = "https://github.com/meadow-lang/Scythe.git", branch = "master" }

# Bytecode, on the JIT: a build with no LLVM in it, which is a third of the
# time one through Silo takes.
[profile.debug]
runtime = "glade"

# Native, through LLVM: the fastest MeadowBoot there is, and one that links
# with what LLVM links with.
[profile.release]
runtime = "silo"
