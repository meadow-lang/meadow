[workspace]
resolver = "2"
members = ["meadow", "meadow-find", "meadow-fmt", "meadow-lsp"]

[workspace.package]
version = "0.5.0"
edition = "2024"

[workspace.dependencies]
meadow-fmt = { path = "meadow-fmt" }
meadow-find = { path = "meadow-find" }
meadow-lsp = { path = "meadow-lsp" }
meadow = { path = "meadow" }
meadow-compiler = { path = "../compiler/meadow-compiler" }
meadow-eval = { path = "../eval" }
meadow-glade = { path = "../glade" }
meadow-seq = { path = "../compiler/meadow-seq" }
meadow-cut = { path = "../compiler/meadow-cut" }
meadow-axcut = { path = "../compiler/meadow-axcut" }
meadow-codegen = { path = "../compiler/meadow-codegen" }
meadow-llvm = { path = "../compiler/meadow-llvm" }
meadow-bytecode = { path = "../compiler/meadow-bytecode" }

# The `meadow` binary is an interpreter: its inner loop wants cross-crate
# inlining, and the instruction dispatch wants to be one function rather than
# sixteen translation units that cannot see each other. `panic = "abort"` is
# left off — `meadow test` reports a failing test by catching one.
[profile.release]
lto = true
codegen-units = 1

# A debug build of `meadow` still *runs programs*, and the tests run the whole
# standard library through every machine several times over. Unoptimized, the
# machines are some thirty times slower, and `tests/vm.rs` alone took eleven
# minutes on a fast machine -- and past CI's 45-minute limit on a Windows
# runner, which looked like a hang and was not one. So the crates that execute
# programs are optimized in every profile; debug assertions stay on, and
# everything else -- the compiler, the tools, the tests -- stays quick to build.
[profile.dev.package.meadow-glade]
opt-level = 2

[profile.dev.package.meadow-eval]
opt-level = 2

[profile.dev.package.meadow-seq]
opt-level = 2

[profile.dev.package.meadow-core]
opt-level = 2
