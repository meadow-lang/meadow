[package]
name = "meadow-host"
description = "The `meadow` command line as a C library, for MeadowBoot to call what it does not do itself."
version.workspace = true
edition.workspace = true

[lib]
name = "meadow_host"
path = "src/lib.rs"
crate-type = ["cdylib"]

[dependencies]
meadow.workspace = true
serde_json = "1"
