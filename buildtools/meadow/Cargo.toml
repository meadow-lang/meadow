[package]
name = "meadow"
description = "The Meadow build system (package discovery, pipeline, linker, embedded stdlib) plus the CLI and REPL."
version.workspace = true
edition.workspace = true

[[bin]]
name = "meadow"
path = "src/main.rs"

[dependencies]
meadow-compiler.workspace = true
meadow-eval.workspace = true
meadow-seq.workspace = true
meadow-cut.workspace = true
meadow-llvm.workspace = true
meadow-fmt.workspace = true
meadow-lsp.workspace = true
meadow-find.workspace = true
# The `Ctrl-F` declaration finder's pop-up: see `finder.rs`.
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
chumsky = { version = "0.13.0", features = ["pratt"] }
clap = { version = "4.6.1", features = ["cargo", "derive"] }
env_logger = "0.11.10"
itertools = "0.14.0"
yansi = { version = "1.0", features = ["detect-tty", "detect-env"] }
serde_json = "1"
rustyline = { version = "18.0.0", features = ["with-file-history", "derive", "custom-bindings"] }
postcard = { version = "1.1.3", features = ["use-std"] }

[target.'cfg(windows)'.dependencies]
# Finds Visual Studio's `cl.exe` to link a native executable with, as `cc` does.
find-msvc-tools = "0.1"

[dev-dependencies]
insta = "1.47.2"
meadow-axcut.workspace = true

