[package]
name = "meadow-llvm"
description = "AxCut to LLVM IR, with the AxCut paper's reference counting: the backend of `meadow build --runtime silo`."
version.workspace = true
edition.workspace = true

[lib]
name = "meadow_llvm"
path = "src/lib.rs"

[dependencies]
meadow-axcut.workspace = true
meadow-intern.workspace = true
meadow-rt.workspace = true

[dev-dependencies]
meadow-scratch.workspace = true
meadow-compiler = { path = "../meadow-compiler" }
# The tests lower real programs, which takes Meadow's front end.
meadow-core.workspace = true
meadow-hir.workspace = true
meadow-seq.workspace = true
