[workspace]

[package]
name = "meadow-glade"
description = "The Meadow runtime system: a register bytecode VM with a low-pause generational collector. It executes straight-line bytecode and knows nothing about the IR that produced it."
version = "0.5.0"
edition = "2024"

[lib]
name = "meadow_glade"
path = "src/lib.rs"
# A static library too, for a program compiled ahead of time to link against:
# see `src/aot.rs`.
crate-type = ["rlib", "staticlib"]

[dependencies]
meadow-bytecode = { path = "../compiler/meadow-bytecode" }
meadow-rt = { path = "../compiler/meadow-rt" }
meadow-intern = { path = "../compiler/meadow-intern" }
num-bigint = "0.4"
num-traits = "0.2"

[dev-dependencies]
# The differential tests need the front end to get a `core::Program` from
# source, the AxCut back end to turn one into bytecode, and the CEK machine to
# say what the answer should be.
meadow-compiler = { path = "../compiler/meadow-compiler" }
meadow-core = { path = "../compiler/meadow-core" }
meadow-seq = { path = "../compiler/meadow-seq" }
meadow-codegen = { path = "../compiler/meadow-codegen" }
meadow-eval = { path = "../eval" }
meadow-bytecode = { path = "../compiler/meadow-bytecode" }

# Same reasoning as `buildtools`: this crate *is* the inner loop. It matters
# here too because `cargo test --release` in this workspace is where the VM is
# measured.
[profile.release]
lto = true
codegen-units = 1

# The tests run programs, and an unoptimized machine runs them some thirty
# times slower -- minutes of CI, twice over in the collector stress pass.
# Debug assertions stay on, which is what a debug build of this crate is for.
[profile.dev]
opt-level = 2

[profile.dev.package.meadow-core]
opt-level = 2

[profile.dev.package.meadow-rt]
opt-level = 2

[target.'cfg(windows)'.dev-dependencies]
# Finds Visual Studio's `cl.exe`, for the ahead-of-time tests to link with.
find-msvc-tools = "0.1"

[features]
# Account for every allocation by the instruction that made it, so a profile
# can say where a program's garbage comes from as well as where its time goes.
# Off by default and compiled out entirely when it is: the accounting sits on
# the bump allocator, which is the hottest path in the runtime.
profile-alloc = []
