# Build MeadowBoot -- the Meadow compiler written in Meadow -- for every
# platform it runs on, as the toolchain a release ships: the archive
# `meadow-<target>` that `meadowup` installs. Each archive holds MeadowBoot;
# `meadow-host`, the library of the back end it calls in its own process, and
# the Rust `meadow` (both built from the same commit, the standard library
# compiled into them); `meadowup`; and in `lib/`, the standard library's
# sources, which MeadowBoot compiles, and `Std.mwstd`, which it takes instead
# where it can: MeadowBoot finds the rest beside itself. It holds too Silo's
# runtime for each phone its system builds for, in `lib/<triple>/`, where the
# back end looks for a target's: Android's on every desktop, and iOS's on a
# Mac. A build for one needs only the NDK, or Xcode, beside the archive.
#
# In the archive MeadowBoot is `MeadowBoot` and the Rust compiler `meadow`,
# so that a `meadowup` from before this layout, which installs the file
# called `meadow` and nothing else, installs a compiler that works on its
# own. `meadowup` from this one on installs the lot, MeadowBoot as `meadow`
# and the Rust compiler as `meadow-rust`, its fallback front end:
# `installer/src/toolchain.rs`.
#
# Cut one by pushing a tag, which is pushed once and does not move:
#
#     git tag meadowboot-v0.1.0-pre.3 && git push origin meadowboot-v0.1.0-pre.3
#
# A tag with no release yet is given one, as a prerelease that is not the
# latest: `meadow`'s own releases are `release.yml`'s. That workflow calls
# this one for every version and every nightly, and publishes nothing until
# MeadowBoot has built itself here on each target that is not experimental:
# a compiler written in Meadow that cannot compile itself is a broken
# release, however well the rest of it tests. Its archives then go on that
# release, with the rest. Each target is built on
# a runner of its own system and processor, since `meadow` compiles MeadowBoot
# natively for the machine it is on. Each then has the MeadowBoot it built
# build MeadowBoot, and that build it again, to the same Cut
# (`scripts/meadowboot-selfbuild.sh`). A manual run builds everything and
# keeps the archives as artifacts without publishing.

name: meadowboot

on:
  push:
    tags: ["meadowboot-v*"]
  workflow_dispatch:
  workflow_call:
    # What the caller is building, as `release.yml` takes it: the toolchain
    # says it with `meadow --version`, which MeadowBoot asks of the back end
    # built here.
    inputs:
      channel:
        description: "`stable`, `nightly` or `dev`: what the build says it is"
        type: string
        default: "dev"
      date:
        description: "The day a nightly is built, as its version says it"
        type: string
        default: ""
      commit:
        description: "The commit a nightly is built from, short"
        type: string
        default: ""

# What `buildtools/meadow/build.rs` reads to decide the channel. A workflow
# that calls this one does not pass on its own environment, only its inputs;
# run on its own tags, or by hand, it is a build like one from a checkout.
env:
  MEADOW_CHANNEL: ${{ inputs.channel || 'dev' }}
  MEADOW_BUILD_DATE: ${{ inputs.date }}
  MEADOW_COMMIT: ${{ inputs.commit }}

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    # A target marked experimental that fails does not hold up the others:
    # `publish` needs this job, and one red leg would otherwise skip it.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            phones: aarch64-linux-android x86_64-linux-android
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            phones: aarch64-linux-android x86_64-linux-android
          - target: aarch64-apple-darwin
            os: macos-latest
            phones: aarch64-apple-ios aarch64-apple-ios-sim aarch64-linux-android x86_64-linux-android
          # Built natively on the platforms' own runners, and experimental
          # until each has been seen to work: Silo on ARM has been run under
          # emulation only, and the Intel macOS runner is the last of its kind.
          - target: x86_64-apple-darwin
            os: macos-15-intel
            experimental: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            experimental: true
          # Not ARM Windows: `corosensei`, Silo's stack switching, does not
          # build for `aarch64-pc-windows-msvc`, so there is no runtime to
          # link MeadowBoot with there.

    steps:
      - uses: actions/checkout@v4

      # As in `release.yml`: the macos-26 image's Command Line Tools link
      # against an SDK they cannot read, and Xcode's, named three ways, is one
      # they can. A native build links with clang, so MeadowBoot's does too.
      - name: Use Xcode's SDK
        if: runner.os == 'macOS'
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          sdk="$xcode/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk"
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          echo "SDKROOT=$sdk" >> "$GITHUB_ENV"
          sudo ln -sfn "$sdk" /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk

      - name: Install Rust
        run: rustup update stable

      # Silo links with clang: the Windows images carry LLVM but leave it off
      # the path.
      - name: Put LLVM on the path
        if: runner.os == 'Windows'
        shell: bash
        run: echo 'C:\Program Files\LLVM\bin' >> "$GITHUB_PATH"

      - name: Which clang
        shell: bash
        run: clang --version

      # The Rust compiler's standard library, compiled ahead of time and built
      # into the `meadow` and `meadow-host` below, as `release.yml` builds it
      # into the `meadow` it ships alone: the `meadow` in the archive is the
      # one a `meadowup` from before MeadowBoot installs, on its own, and
      # `meadow-rust` once installed.
      - name: Precompile the Rust compiler's Std
        working-directory: buildtools
        shell: bash
        run: |
          MEADOW_EMBED_RUNTIME=0 cargo build --release -p meadow
          host="target/release/meadow"
          [ -f "$host.exe" ] && host="$host.exe"
          "$host" __precompile-std "$RUNNER_TEMP/std.bin" --target ${{ matrix.target }}
          echo "MEADOW_PRECOMPILED_STD=$RUNNER_TEMP/std.bin" >> "$GITHUB_ENV"

      # And `meadow-host`, the same `meadow` as a library, which MeadowBoot
      # loads to run the back end in its own process.
      - name: Build meadow
        working-directory: buildtools
        run: cargo build --release -p meadow -p meadow-host

      # `meadowup`, which goes in the archive so that an update replaces it
      # with the toolchain: see `release.yml`.
      - name: Build meadowup
        working-directory: installer
        run: cargo build --release

      # MeadowBoot's dependencies (Lingua, Scythe) are fetched by git. It
      # calls `meadow-host` through `Std.Ffi`, which `MEADOW_BOOTSTRAP` lets
      # whichever channel this `meadow` is take.
      - name: Build MeadowBoot
        shell: bash
        env:
          MEADOW_BOOTSTRAP: "1"
        run: |
          meadow=buildtools/target/release/meadow
          [ -f "$meadow.exe" ] && meadow="$meadow.exe"
          "$meadow" build --release bootstrap

      - name: Bundle
        shell: bash
        run: |
          exe=""
          [ "$RUNNER_OS" = "Windows" ] && exe=".exe"
          # Named as `release.yml` names the archive of each target, which is
          # what the installers fetch.
          dir="meadow-${{ matrix.target }}"
          mkdir -p "$dir/lib/Std"
          case "$RUNNER_OS" in
            Windows) host="meadow_host.dll" ;;
            macOS) host="libmeadow_host.dylib" ;;
            *) host="libmeadow_host.so" ;;
          esac
          cp "bootstrap/target/release/native/silo/MeadowBoot$exe" "buildtools/target/release/meadow$exe" "buildtools/target/release/$host" "installer/target/release/meadowup$exe" "$dir/"
          cp lib/Std/Meadow.toml "$dir/lib/Std/"
          cp -r lib/Std/src "$dir/lib/Std/"
          # A library keeps the symbols it exports: `strip -x` drops only the
          # local ones.
          if [ "$RUNNER_OS" != "Windows" ]; then strip "$dir/MeadowBoot" "$dir/meadow"; strip -x "$dir/$host"; fi
          # MeadowBoot's standard library compiled, beside its sources, so
          # that no build compiles it. After `strip`: the file is named by the
          # size of the MeadowBoot that wrote it, which is the one shipped.
          env -u MEADOW -u MEADOWBOOT_STD "$dir/MeadowBoot$exe" __precompile-std "$dir/lib/Std.mwstd"
          ls -l "$dir" "$dir/lib"
          echo "BUNDLE=$dir" >> "$GITHUB_ENV"

      # Silo's runtime for each phone, built from this commit as the `meadow`
      # beside it is -- the two agree on a fingerprint of the sources -- with
      # the NDK the runner carries, or Xcode.
      #
      # On Windows this has not been seen to work, and an archive without
      # them is better than none.
      - name: Phone runtimes
        if: matrix.phones != ''
        continue-on-error: ${{ runner.os == 'Windows' }}
        shell: bash
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          for t in ${{ matrix.phones }}; do
            lib=$(bash scripts/silo-runtime.sh "$t" | tail -n 1)
            mkdir -p "$BUNDLE/lib/$t"
            cp "$lib" "$BUNDLE/lib/$t/"
          done
          ls -R "$BUNDLE/lib" | grep -v '\.mw$' | head -40

      # The bundle on its own, told nothing: a program runs, and a package
      # that exports to C builds to a library named for it.
      - name: Smoke test
        shell: bash
        run: |
          exe=""
          [ "$RUNNER_OS" = "Windows" ] && exe=".exe"
          mb="$PWD/$BUNDLE/MeadowBoot$exe"
          work="$RUNNER_TEMP/smoke"
          mkdir -p "$work/Hello/src" "$work/Lib/src"
          printf '[package]\nname = "Hello"\nversion = "0.1.0"\n' > "$work/Hello/Meadow.toml"
          printf 'use Std.Num.Float as F\n\nfun main () = println (show (F.round (F.sqrt 2.0 * 100.0)))\n' > "$work/Hello/src/Main.mw"
          printf '[package]\nname = "Lib"\nversion = "0.1.0"\n' > "$work/Lib/Meadow.toml"
          printf '@export\nfun twice (x : Int) : Int = x * 2\n' > "$work/Lib/src/Main.mw"
          cd "$work"
          env -u MEADOW -u MEADOWBOOT_STD "$mb" run Hello | tail -1 | grep -qx '141'
          env -u MEADOW -u MEADOWBOOT_STD "$mb" build Lib
          ls Lib/target/debug/native/silo/ | grep -E '^(Lib\.dll|libLib\.so|libLib\.dylib)$'
          # And for a phone, from the runtimes the bundle carries: Android's
          # with the NDK, iOS's with Xcode. Run, they are the `android` and
          # `ios` workflows'; here, that the archive can make them.
          [ "$RUNNER_OS" = "Windows" ] && exit 0
          export ANDROID_NDK_HOME="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          for t in ${{ matrix.phones }}; do
            env -u MEADOW -u MEADOWBOOT_STD "$mb" build --release --target "$t" Lib
            ls "Lib/target/release/native/$t/silo/"
          done

      # The archive as `meadowup` installs it, into a home of its own, asked
      # what `release.yml` asks of the `meadow` it ships alone -- its version;
      # a program run from an empty home, which compiles nothing of the Rust
      # compiler's Std; `init`, which MeadowBoot hands to the Rust back end,
      # and the package built to a native executable; and every source in
      # the repository, through the language server -- and then what this
      # release has besides: what MeadowBoot does not act on yet goes to the
      # Rust front end installed beside it, and the install updates and comes
      # out again.
      - name: Smoke test, installed
        shell: bash
        run: |
          exe=""
          [ "$RUNNER_OS" = "Windows" ] && exe=".exe"
          unset MEADOW MEADOWBOOT_STD MEADOW_HOST
          home="$RUNNER_TEMP/installed"
          MEADOW_HOME="$home" "$BUNDLE/meadowup$exe" install --from "$BUNDLE" --no-modify-path
          bin="$home/bin/meadow$exe"
          # The version the Rust compiler beside it was built to say: the
          # channel, and a nightly's day and commit.
          said=$("$bin" --version)
          echo "$said"
          [ "$said" = "$("$home/bin/meadow-rust$exe" --version)" ]
          # A file in no package is the Rust front end's still: MeadowBoot
          # builds packages.
          echo 'fun main () = println (show (6 * 7))' > "$RUNNER_TEMP/smoke.mw"
          MEADOW_HOME="$RUNNER_TEMP/fresh-home" "$bin" run "$RUNNER_TEMP/smoke.mw" | tail -1 | grep -qx '42'
          if [ -d "$RUNNER_TEMP/fresh-home/lib/std" ]; then
            echo "Std was compiled: the precompiled one is not built in" >&2
            exit 1
          fi
          "$bin" init "$RUNNER_TEMP/smokepkg"
          (cd "$RUNNER_TEMP/smokepkg" && "$bin" run --release --aot . | tail -1 | grep -q 'Hello, world!')
          (cd "$RUNNER_TEMP/smokepkg" && "$bin" run --all-features . 2>&1 | tee "$RUNNER_TEMP/fallback.txt" | tail -1 | grep -q 'Hello, world!')
          grep -q 'meadow-rust' "$RUNNER_TEMP/fallback.txt"
          # The archive's sources, as an editor on this machine gets them.
          cd "$GITHUB_WORKSPACE"
          # A loop, not `mapfile`: macOS ships bash 3.2, which has none.
          sources=()
          while IFS= read -r f; do sources+=("$f"); done < <(git ls-files '*.mw' | grep -v -e '^bootstrap/tests/lex/' -e '^bootstrap/tests/parse/' -e '^bootstrap/tests/rename/Cfg/')
          MEADOW_HOME="$RUNNER_TEMP/lsp-home" "$bin" lsp --check "${sources[@]}"
          # An update over it, and out again -- by the archive's `meadowup`:
          # Windows does not let the one in the home delete itself.
          MEADOW_HOME="$home" "$BUNDLE/meadowup$exe" update --from "$BUNDLE" --no-modify-path
          MEADOW_HOME="$home" "$home/bin/meadowup$exe" show
          MEADOW_HOME="$home" "$BUNDLE/meadowup$exe" uninstall --no-modify-path
          [ ! -e "$home" ]

      # A zip whose paths use forward slashes, which every unzip reads:
      # 7-Zip's.
      - name: Archive
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$BUNDLE.zip" "$BUNDLE" > /dev/null
            echo "ARCHIVE=$BUNDLE.zip" >> "$GITHUB_ENV"
          else
            tar czf "$BUNDLE.tar.gz" "$BUNDLE"
            echo "ARCHIVE=$BUNDLE.tar.gz" >> "$GITHUB_ENV"
          fi

      # Under a name of its own: `release.yml`'s Rust `meadow` of the same
      # target is an artifact named for its archive, which this one replaces.
      - uses: actions/upload-artifact@v4
        with:
          name: meadowboot-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

      # MeadowBoot compiled by itself (stage 2), and stage 2 compiling
      # MeadowBoot again to the very Cut it was made from: see the script.
      # After the archive is kept, so that a failure here still leaves it to
      # look at; a failure fails the target, as a broken archive would.
      - name: Self-build
        shell: bash
        timeout-minutes: 60
        run: |
          exe=""
          [ "$RUNNER_OS" = "Windows" ] && exe=".exe"
          bash scripts/meadowboot-selfbuild.sh \
            "bootstrap/target/release/native/silo/MeadowBoot$exe" \
            "buildtools/target/release/meadow$exe"

  publish:
    needs: build
    # Its own tags only: called by `release.yml`, the release is that
    # workflow's, and it takes these archives with its own.
    if: startsWith(github.ref, 'refs/tags/meadowboot-v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if ! gh release view "$TAG" -R "$REPO" > /dev/null 2>&1; then
            gh release create "$TAG" -R "$REPO" --verify-tag --prerelease --latest=false \
              --title "MeadowBoot ${TAG#meadowboot-v}" \
              --notes "MeadowBoot built from ${GITHUB_SHA::7}: each archive holds MeadowBoot, a \`meadow\` from the same commit, \`meadowup\` and \`lib/\`; \`meadowup install --from <the unpacked archive>\` installs it. Native builds need \`clang\` on \`PATH\`."
          fi
          gh release upload "$TAG" -R "$REPO" dist/* --clobber
