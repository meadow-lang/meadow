# Build `meadow` for every supported platform and attach the archives to a
# GitHub Release, plus `meadowup-*.exe` — the double-clickable Windows
# installer built from `installer/`.
#
# Asset names carry no version, so the installers can use the
# `/releases/latest/download/...` redirect and never need to know the tag.
#
# Cut a release by pushing a version's tag, which is pushed once and does not
# move:
#
#     git tag v0.2.0 && git push origin v0.2.0
#
# That is the **stable** channel: the build says `meadow 0.2.0`, accepts no
# unstable feature, and is what `/releases/latest` and `meadowup update` find.
# The **nightly** channel is `nightly.yml`, which calls this workflow for the
# builds and publishes them itself, under the tag `nightly`.
#
# A manual run builds everything and leaves the archives as workflow artifacts
# without publishing.

name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
  workflow_call:
    inputs:
      channel:
        description: "`stable` or `nightly`: what the build says it is"
        type: string
        required: true
      date:
        description: "The day a nightly is built, as its version says it"
        type: string
        default: ""
      commit:
        description: "The commit a nightly is built from, short"
        type: string
        default: ""

# What `buildtools/meadow/build.rs` reads to decide the channel: a version's
# tag is stable, a caller says what it is, and anything else is a build like
# one from a checkout.
env:
  MEADOW_CHANNEL: ${{ inputs.channel || (github.ref_type == 'tag' && 'stable') || 'dev' }}
  MEADOW_BUILD_DATE: ${{ inputs.date }}
  MEADOW_COMMIT: ${{ inputs.commit }}

permissions:
  contents: write
  statuses: read

jobs:
  # Nothing is published until this passes. It runs the same `scripts/check.sh`
  # as `ci.yml`, plus the version check — the only thing a tag can get wrong that
  # a branch cannot, since the release assets carry no version and nothing
  # downstream would notice a tag that disagreed with the manifests.
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The commit a release is cut from, or a nightly built from, has usually
      # had the suite run on it before it was pushed, and says so: see
      # `scripts/checked-elsewhere.sh`. Then only what a tag adds is checked
      # here -- that it agrees with the manifests.
      - name: Was this commit checked already?
        id: checked
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/checked-elsewhere.sh "${{ github.repository }}" "${{ github.sha }}" | tee -a "$GITHUB_OUTPUT"
      - name: Install Rust
        if: steps.checked.outputs.skip != 'true'
        run: rustup update stable
      # `check.sh` builds the VS Code extension when npm is present. Pinned
      # rather than left to whatever the runner ships, for the same reason
      # `vsce` is pinned: an implicit tool version is a build that breaks on
      # someone else's schedule.
      - uses: actions/setup-node@v4
        if: steps.checked.outputs.skip != 'true'
        with:
          node-version: "20"
      - name: Check
        shell: bash
        run: |
          tag=""
          if [ "${{ github.ref_type }}" = "tag" ] && [ "$MEADOW_CHANNEL" = "stable" ]; then
            tag="${{ github.ref_name }}"
          fi
          if [ "${{ steps.checked.outputs.skip }}" = "true" ]; then
            if [ -n "$tag" ]; then bash scripts/version-check.sh "$tag"; fi
          elif [ -n "$tag" ]; then
            bash scripts/check.sh --version "$tag"
          else
            bash scripts/check.sh
          fi

  build:
    name: ${{ matrix.target }}
    needs: checks
    runs-on: ${{ matrix.os }}
    # A target marked experimental that fails does not hold up the release for
    # every other platform: `release` needs this job, and one red leg of the
    # matrix would otherwise skip it.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            linker: aarch64-linux-gnu-gcc
            apt: gcc-aarch64-linux-gnu
          - target: x86_64-apple-darwin
            os: macos-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: aarch64-pc-windows-msvc
            os: windows-latest
          # Android, which is what Termux on a phone is. Not the Linux build:
          # Android's C library is Bionic, not glibc, and its loader refuses a
          # glibc executable outright -- the first thing it notices is that
          # the thread-local storage segment is not aligned as ARM64 Bionic
          # needs. Rust's Android target keeps thread-locals out of that
          # segment altogether, and links against Bionic with the NDK the
          # runner already has. Experimental until it has run on a phone.
          - target: aarch64-linux-android
            os: ubuntu-latest
            ndk: true
            experimental: true

    steps:
      - uses: actions/checkout@v4

      # The macos-26 image's Command Line Tools link against an SDK they
      # cannot read ("unknown architecture arm64e.x1-macos"). Xcode's own SDK,
      # named three ways -- the developer directory, `SDKROOT`, and the path
      # the Command Line Tools look at -- is one they can. Harmless on the
      # image before it, which needs none of this; a run lands on either
      # while the image rolls out, and says which under "Set up job".
      - name: Use Xcode's SDK
        if: runner.os == 'macOS'
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -n 1)
          sdk="$xcode/Contents/Developer/Platforms/MacOSX.platform/Developer/SDKs/MacOSX.sdk"
          echo "DEVELOPER_DIR=$xcode/Contents/Developer" >> "$GITHUB_ENV"
          echo "SDKROOT=$sdk" >> "$GITHUB_ENV"
          sudo ln -sfn "$sdk" /Library/Developer/CommandLineTools/SDKs/MacOSX.sdk

      - name: Install Rust
        run: rustup update stable && rustup target add ${{ matrix.target }}

      - name: Install cross linker
        if: matrix.apt != ''
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.apt }}

      # The NDK's clang for API 24 -- Android 7, the oldest Termux runs on --
      # as the linker, and its C compiler and archiver for any crate that
      # builds C. The runner image carries an NDK; `ANDROID_NDK_LATEST_HOME`
      # is where.
      - name: Use the Android NDK
        if: matrix.ndk
        run: |
          bin="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          {
            echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$bin/aarch64-linux-android24-clang"
            echo "CC_aarch64_linux_android=$bin/aarch64-linux-android24-clang"
            echo "AR_aarch64_linux_android=$bin/llvm-ar"
          } >> "$GITHUB_ENV"

      # The standard library, compiled ahead of time for the target and built
      # into the `meadow` below, so that it never compiles `Std` itself: see
      # `buildtools/meadow/src/stdlib.rs`. Most targets are cross-compiled and
      # their `meadow` cannot run here, so a `meadow` for this runner does it --
      # the compile depends only on the target's system and processor, and on
      # the sources, which the two builds share. Without the runtime library
      # built in, which this one does not need.
      - name: Precompile Std
        working-directory: buildtools
        shell: bash
        run: |
          MEADOW_EMBED_RUNTIME=0 cargo build --release -p meadow
          host="target/release/meadow"
          [ -f "$host.exe" ] && host="$host.exe"
          "$host" __precompile-std "$RUNNER_TEMP/std.bin" --target ${{ matrix.target }}
          echo "MEADOW_PRECOMPILED_STD=$RUNNER_TEMP/std.bin" >> "$GITHUB_ENV"

      # The CLI lives in the `buildtools/` workspace.
      - name: Build
        working-directory: buildtools
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}

      # Skip on the cross-compiled targets, which cannot run on the runner.
      - name: Smoke test
        if: matrix.target == 'x86_64-unknown-linux-gnu' || matrix.target == 'aarch64-apple-darwin' || matrix.target == 'x86_64-pc-windows-msvc'
        working-directory: buildtools
        shell: bash
        run: |
          bin="target/${{ matrix.target }}/release/meadow"
          [ -f "$bin.exe" ] && bin="$bin.exe"
          "$bin" --version
          echo 'fun main () = println (show (6 * 7))' > /tmp/smoke.mw
          # With `Std` built in, a first run in an empty home compiles nothing
          # of it and keeps nothing.
          MEADOW_HOME="$RUNNER_TEMP/fresh-home" "$bin" run /tmp/smoke.mw | tail -1 | grep -qx '42'
          if [ -d "$RUNNER_TEMP/fresh-home/lib/std" ]; then
            echo "Std was compiled: the precompiled one is not built in" >&2
            exit 1
          fi
          # A release build is a native executable, linked against the runtime
          # built into the binary; `--aot` makes falling back an error.
          bin="$PWD/$bin"
          "$bin" init "$RUNNER_TEMP/smokepkg"
          (cd "$RUNNER_TEMP/smokepkg" && "$bin" run --release --aot . | tail -1 | grep -q 'Hello, world!')
          # Every Meadow source in the repository, as this binary's language
          # server sees it, from an empty home: what is built in -- `Std`
          # precompiled for this target -- is what an editor on this machine
          # gets, and `check.sh` runs a `meadow` built from the checkout,
          # which has none of it. MeadowBoot's dependencies are fetched.
          cd "$GITHUB_WORKSPACE"
          mapfile -t sources < <(git ls-files '*.mw' | grep -v -e '^bootstrap/tests/lex/' -e '^bootstrap/tests/parse/' -e '^bootstrap/tests/rename/Cfg/')
          MEADOW_HOME="$RUNNER_TEMP/lsp-home" "$bin" lsp --check "${sources[@]}"

      # `meadowup`, the toolchain manager, and on Windows the double-clickable
      # bootstrap beside it. Its own workspace -- it depends on no Meadow crate,
      # since it has to work before Meadow is installed at all.
      - name: Build meadowup
        working-directory: installer
        run: cargo build --release --target ${{ matrix.target }}
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}

      # Two things are published per target. `meadowup-<target>` on its own is
      # what a person downloads, and what `meadowup-init.sh` fetches: it is small, and
      # it is the only thing needed to get started. The archive beside it is the
      # whole toolchain, which `meadowup install` pulls -- with meadowup in it
      # too, so an update replaces meadowup along with the build tool and a
      # machine cannot be left holding one too old to update what it manages.
      - name: Package (unix)
        if: matrix.os != 'windows-latest'
        run: |
          staging="$RUNNER_TEMP/pkg"
          mkdir -p "$staging"
          cp "buildtools/target/${{ matrix.target }}/release/meadow" "$staging/"
          cp "installer/target/${{ matrix.target }}/release/meadowup" "$staging/"
          tar -czf "$GITHUB_WORKSPACE/meadow-${{ matrix.target }}.tar.gz" -C "$staging" meadow meadowup
          cp "$staging/meadowup" "$GITHUB_WORKSPACE/meadowup-${{ matrix.target }}"

      - name: Package (windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          # The archive `meadowup install` pulls: the build tool and meadowup.
          Compress-Archive `
            -Path buildtools/target/${{ matrix.target }}/release/meadow.exe, `
                  installer/target/${{ matrix.target }}/release/meadowup.exe `
            -DestinationPath meadow-${{ matrix.target }}.zip
          # And meadowup on its own -- the thing to download and double-click,
          # under a name that says which machine it is for.
          $arch = '${{ matrix.target }}'.Split('-')[0]
          Copy-Item installer/target/${{ matrix.target }}/release/meadowup.exe `
            "meadowup-$arch.exe"

      - uses: actions/upload-artifact@v4
        with:
          name: meadow-${{ matrix.target }}
          path: |
            meadow-${{ matrix.target }}.tar.gz
            meadow-${{ matrix.target }}.zip
            meadowup-${{ matrix.target }}
            meadowup-*.exe
          if-no-files-found: error

  # The VS Code extension and the colour theme. Platform-independent, so they
  # are built once rather than per target, and attached alongside the binaries.
  extension:
    name: vsix
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Both extensions in one directory: an artifact of files from two keeps
      # the directories they came from, and a release takes files, not a
      # directory -- the nightly of 2026-10-11 failed on `artifacts/vscode`
      # after the release before it was deleted, and none was published again.
      - name: Build
        run: |
          editors/vscode/build.sh
          editors/vscode-theme/build.sh
          mkdir -p vsix
          cp editors/vscode/*.vsix editors/vscode-theme/*.vsix vsix/
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: vsix/*.vsix
          if-no-files-found: error

  release:
    needs: [build, extension]
    runs-on: ubuntu-latest
    # Only a tag push publishes. A manual run still builds every target and
    # leaves the archives as workflow artifacts, which is what you want when
    # testing the matrix without cutting a release.
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # A version is published once. A tag that already has a release was
      # moved, and what people installed under that number would no longer be
      # what the number means: stop, and cut the next version instead.
      - name: Refuse to republish a version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            echo "${{ github.ref_name }} is already released: a version's tag does not move" >&2
            exit 1
          fi

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
          body: |
            ## Install

            **Windows** — download **`meadowup-x86_64.exe`** below and run it.
            (On an ARM machine take `meadowup-aarch64.exe`.) It installs itself
            and the toolchain, and adds them to your `PATH`; open a new terminal
            afterwards.

            **macOS / Linux / Android (Termux)**

            ```sh
            curl -fsSL https://raw.githubusercontent.com/${{ github.repository }}/master/scripts/meadowup-init.sh | sh
            ```

            Then `meadow` starts the REPL and `meadow run <path>` builds and runs
            a package, while `meadowup update` brings the toolchain forward --
            the two split the way `cargo` and `rustup` do.

            **VS Code** — download **`meadow-<version>.vsix`** below and install it
            with *Extensions: Install from VSIX…*, or:

            ```sh
            code --install-extension meadow-[0-9]*.vsix
            ```

            It gives you syntax highlighting on its own, and diagnostics, hover,
            go-to-definition and inlay hints once `meadow` is on your `PATH` —
            the extension runs `meadow lsp`. **`meadow-theme-<version>.vsix`** is
            the Meadow colour theme, dark and light, installed the same way.
