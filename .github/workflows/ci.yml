# Every push and pull request. The gate.
#
# The steps live in `scripts/check.sh`, not here — so that running it locally is
# the same thing CI does, and so adding a check means editing one file rather
# than two. See `release.yml`, which runs the same script before it publishes.

name: ci

on:
  push:
    branches: [master]
  pull_request:
  # What the merge queue asks for: the checks run on the merge of a pull
  # request with `master` as it is then, before that merge is `master`.
  merge_group:
  workflow_dispatch:

# Reading a commit's statuses is how a run learns the suite has passed on
# Linux already: see `scripts/checked-elsewhere.sh`.
permissions:
  contents: read
  statuses: read

# A new push to a branch makes the run in flight irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The default is six hours, which is how long a hung step would otherwise
    # hold a runner. This is not a guess at how long a run takes, and must not
    # be close to it: at 45 minutes it cancelled runs that were merely slow --
    # the same script took 66 minutes in `release.yml` and passed -- and a
    # cancelled run reads as a hang. If a run gets near this, the fix is in the
    # tests (see the dev profiles in `buildtools/Cargo.toml` and
    # `glade/Cargo.toml`), not here.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Linux is where releases are cut from; Windows is where the work is
        # done, and the only place path handling and the installer differ.
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      # A commit pushed to `master` has usually had this whole script run on
      # it already, on Linux, and says so. Then the Linux leg is done; the
      # Windows leg is run whatever anybody says, since nothing else runs it.
      - name: Was this commit checked already?
        id: checked
        if: runner.os == 'Linux' && github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/checked-elsewhere.sh "${{ github.repository }}" "${{ github.sha }}" | tee -a "$GITHUB_OUTPUT"

      - name: Install Rust
        if: steps.checked.outputs.skip != 'true'
        run: rustup update stable

      # `check.sh` also builds the VS Code extension, which needs npm. It skips
      # that step when npm is absent, so this is what makes it a gate rather
      # than a suggestion.
      - uses: actions/setup-node@v4
        if: steps.checked.outputs.skip != 'true'
        with:
          node-version: "20"

      # Five independent workspaces, so five target directories. `rust-cache`
      # keeps only what the dependencies built and drops the workspace's own
      # crates and test binaries, which are rebuilt on every change anyway.
      # Caching whole target directories made the cache several gigabytes, and
      # saving that on Windows took longer than the checks.
      - uses: Swatinem/rust-cache@v2
        if: steps.checked.outputs.skip != 'true'
        with:
          workspaces: |
            compiler
            glade
            eval
            buildtools
            installer

      # Invoked through `bash` rather than executed: the tree is developed on
      # Windows, where `core.filemode` is off, so a script's executable bit is
      # easy to lose and the failure only shows up here.
      - name: Check
        if: steps.checked.outputs.skip != 'true'
        shell: bash
        run: bash scripts/check.sh
